<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trips｜旅行攻略</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--line:#263758;--txt:#eef4ff;--muted:#9fb0c9;--accent:#8bb8ff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#0b1220,#0f1728 48%,#0b1220);color:var(--txt);min-height:100vh}
.wrap{max-width:1120px;margin:auto;padding:56px 22px 72px}.hero{padding:26px 0 38px;border-bottom:1px solid var(--line);margin-bottom:28px}.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:46px;margin:10px 0 12px}.hero p{margin:0;color:var(--muted);font-size:16px;line-height:1.7}.summary{margin-top:18px;color:#d6e2f4;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{display:block;text-decoration:none;color:inherit;background:linear-gradient(160deg,#14213a,#10192a);border:1px solid var(--line);border-radius:18px;padding:22px;transition:.2s transform,.2s border-color,.2s box-shadow;min-height:250px}.card:hover{transform:translateY(-3px);border-color:#5276a9;box-shadow:0 16px 40px rgba(0,0,0,.25)}.cover{height:92px;border-radius:13px;background:radial-gradient(circle at 78% 20%,rgba(139,184,255,.35),transparent 30%),linear-gradient(135deg,#244266,#192640);display:flex;align-items:end;padding:14px;margin-bottom:18px;font-size:34px}.region{font-size:12px;color:#9fb0c9}.card h2{font-size:22px;margin:5px 0}.subtitle{color:#d4e0f2;margin:0 0 16px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#203554;color:#dce9ff}.route{font-size:12px;color:var(--muted);line-height:1.65}.go{margin-top:18px;font-size:13px;color:var(--accent);font-weight:600}.empty{padding:30px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}footer{margin-top:34px;color:#71839e;font-size:12px}@media(max-width:640px){.wrap{padding:34px 16px 52px}.hero h1{font-size:36px}.hero{padding-top:10px}.card{min-height:auto}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Travel Notes · Routes · Maps</div>
    <h1>🧭 Trips</h1>
    <p>把每一次旅行整理成可直接使用的路线、地图和路书。</p>
    <div class="summary" id="summary">正在加载旅行攻略…</div>
  </section>
  <main class="grid" id="tripGrid"></main>
  <footer>Hosted on GitHub Pages · Diyigelieren/Trips</footer>
</div>
<script>
const grid=document.getElementById('tripGrid');
const summary=document.getElementById('summary');
fetch('./trips.json').then(r=>r.json()).then(trips=>{
  summary.textContent=`已整理 ${trips.length} 条旅行攻略 · 持续更新`;
  if(!trips.length){grid.innerHTML='<div class="empty">还没有旅行攻略。</div>';return;}
  grid.innerHTML=trips.map(t=>`<a class="card" href="${t.url}">
    <div class="cover">🏔️</div>
    <div class="region">${t.region}</div>
    <h2>${t.title}</h2>
    <p class="subtitle">${t.subtitle}</p>
    <div class="meta"><span class="pill">🗓 ${t.days}</span><span class="pill">🚗 ${t.type}</span><span class="pill">📍 ${t.distance}</span></div>
    <div class="route">${t.route.join(' → ')}</div>
    <div class="go">查看攻略 →</div>
  </a>`).join('');
}).catch(()=>{summary.textContent='旅行攻略';grid.innerHTML='<div class="empty">攻略目录加载失败，请稍后刷新。</div>';});
</script>
</body>
</html>
